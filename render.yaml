services:
  - type: web
    name: subzi-backend
    runtime: docker
    rootDir: vid-sub-engine/backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://sub-zi.vercel.app
      - key: WHISPER_MODEL
        value: base
      - key: MAX_FILE_SIZE_MB
        value: "50"
      - key: DEMUCS_ENABLED
        value: "false"
      - key: WHISPERX_ENABLED
        value: "false"
      - key: UPLOADS_DIR
        value: /tmp/subzi-uploads